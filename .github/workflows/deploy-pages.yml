name: Deploy Web Client to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - 'nexus-backend/src/main/resources/static/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: nexus-backend/src/main/resources/static
          branch: gh-pages
