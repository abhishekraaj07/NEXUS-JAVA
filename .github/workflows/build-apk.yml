name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make Gradlew Executable
        run: chmod +x ./nexus-android/gradlew

      - name: Build Debug APK
        working-directory: ./nexus-android
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: |
          mkdir -p release-artifacts
          cp ./nexus-android/app/build/outputs/apk/debug/app-debug.apk release-artifacts/NEXUS-Chat-v1.0.0.apk

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-Chat-v1.0.0-apk
          path: release-artifacts/NEXUS-Chat-v1.0.0.apk
          retention-days: 30

      - name: Publish GitHub Release with APK
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-apk
          name: "NEXUS Private Chat v1.0.0 (Native Android & Web)"
          body: |
            ## 🛡️ NEXUS Private Chat — v1.0.0 Release

            ### 🚀 Quick Access
            * 🌐 **Live Web Chat (Instant Browser Access)**: [Launch Java Web App](https://nexus-backend-filg.onrender.com)
            * 📱 **Native Android App (APK)**: Download `NEXUS-Chat-v1.0.0.apk` below
            * 💻 **Self-Hosted Spring Boot Server**: Run locally on `http://localhost:8080/` via `./gradlew bootRun`

            ---

            ### ⚡ What's New & Security Features:
            - **Native Android Chat UI**: Full RecyclerView message bubble rendering with sender/receiver styles and delivery checkmarks.
            - **End-to-End Encryption (E2EE)**: ECDH NIST P-256 + HKDF-SHA256 + AES-256-GCM authenticated cipher with 96-bit random IV & AAD.
            - **Anti-Screenshot Protection**: Android `FLAG_SECURE` blocks screenshots, screen recording, and app switcher sniffing.
            - **1× Ephemeral View-Once Photos**: Self-destructing image sharing.
            - **Disappearing Messages**: 5s, 10s, 30s, 1m auto-purge timers.
            - **Out-of-band Fingerprint**: `XXXX-XXXX-XXXX` session verification.
            - **Dynamic Server URL**: Connect to local dev server (`10.0.2.2:8080`), local Wi-Fi IP, or custom cloud relay.
            - **Zero Storage Guarantee**: 0 bytes persisted to database or disk.

            #### 📥 Download & Install:
            Download **`NEXUS-Chat-v1.0.0.apk`** below and install on Android 8.0+ (API 26+).
          files: release-artifacts/NEXUS-Chat-v1.0.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
